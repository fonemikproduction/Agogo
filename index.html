<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL // WALKING THROUGH THE OLD CITY OF SURABAYA</title>
    <style>
        /* --- CORE BASE & CANVAS STYLING --- */
        body, html {
            margin: 0; padding: 0; background-color: #0a0a0a; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; -webkit-tap-highlight-color: transparent; 
            font-family: 'Courier New', Courier, monospace;
            color: #00ff66;
        }
        
        /* Scanline effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        canvas {
            width: 100vw; height: 100vh; object-fit: contain; 
            image-rendering: -moz-crisp-edges; image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges; image-rendering: pixelated; touch-action: none; 
        }

        /* --- START OVERLAY (Audio Context Unlocker) --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95); z-index: 99999;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            flex-direction: column; gap: 15px;
        }
        #start-btn { 
            padding: 20px 40px; border: 1px solid #00ff66; color: #00ff66; 
            font-family: 'Courier New', Courier, monospace; background: transparent; cursor: pointer; font-size: 20px; 
            border-radius: 4px;
        }
        #start-btn:hover { background: #00ff66; color: #0a0a0a; }
        .start-subtitle { color: #008833; font-size: 12px; font-family: 'Courier New', Courier, monospace; }

        /* --- HEADER NAVIGATION & CHAT TOGGLE --- */
        .lang-link {
            position: fixed; top: 21px; right: 125px; z-index: 99999; 
            color: #00aa44; font-family: 'Courier New', Courier, monospace; font-size: 12px; 
            text-decoration: none; border-bottom: 1px dashed #005522;
        }
        .lang-link:hover { color: #00ff66; }

        #chat-toggle-btn {
            position: absolute; top: 15px; right: 15px; z-index: 10002;
            background: #111; color: #00ff66; border: 1px solid #00ff66;
            padding: 6px 12px; font-family: 'Courier New', Courier, monospace; font-size: 12px;
            cursor: pointer; border-radius: 4px;
        }
        #chat-toggle-btn:hover { background: #00ff66; color: #0a0a0a; }

        /* --- SLIDE-OUT CHAT INTERFACE --- */
        #chat-ui {
            position: absolute; top: 55px; right: 15px; width: 280px;
            background: rgba(10, 10, 10, 0.95); color: #00ff66;
            border: 1px solid #00ff66; font-family: 'Courier New', Courier, monospace; font-size: 11px;
            z-index: 10002; display: none; flex-direction: column;
            border-radius: 4px; box-sizing: border-box; pointer-events: auto;
        }
        .chat-header {
            padding: 8px; border-bottom: 1px dashed #005522;
            display: flex; justify-content: space-between; color: #00aa44;
        }
        #chat-messages {
            height: 180px; overflow-y: auto; padding: 8px;
            display: flex; flex-direction: column; gap: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .message { border-left: 2px solid #00ff66; padding-left: 6px; word-wrap: break-word; }
        .message-user { color: #00aa44; font-weight: bold; }
        .message-text { color: #00ff66; margin-top: 2px; }
        .chat-input-area { display: flex; border-top: 1px dashed #005522; }
        #chat-input { flex: 1; background: transparent; border: none; color: #00ff66; padding: 8px; font-family: 'Courier New', Courier, monospace; outline: none; }
        #chat-send { background: #111; color: #00ff66; border: none; border-left: 1px solid #00ff66; padding: 0 12px; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        #chat-send:hover { background: #00ff66; color: #0a0a0a; }

        /* --- PROXIMITY NARRATIVE BUBBLE (Centered Modal) --- */
        #text-bubble {
            position: absolute; display: none; 
            background: rgba(10, 10, 10, 0.95); color: #00ff66; 
            padding: 20px; border: 1px solid #00ff66; font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; line-height: 1.5; left: 50%; top: 50%;
            transform: translate(-50%, -50%); max-width: 650px; width: 85%;
            max-height: 60vh; overflow-y: auto; pointer-events: auto !important; 
            z-index: 10000 !important; border-radius: 4px; box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
        }
        #text-bubble a { color: #00ff66; text-decoration: underline; }

        /* --- MOBILE D-PAD CONTROLS --- */
        #dpad {
            position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px;
            display: grid; grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px 40px;
            gap: 2px; opacity: 0.5; z-index: 10001; user-select: none; -webkit-user-select: none; 
            touch-action: none; pointer-events: none; 
        }
        .dpad-btn {
            background-color: #111; color: #00ff66; border: 1px solid #00ff66;
            font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            box-sizing: border-box; border-radius: 4px; pointer-events: auto; 
        }
        .dpad-btn:active, .dpad-btn.active { background-color: #00ff66; color: #0a0a0a; opacity: 1.0; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* --- FOOTER / PARTNER LOGOS --- */
        #partners {
            position: absolute; bottom: 10px; right: 20px; 
            display: flex; gap: 15px; align-items: center; z-index: 50; pointer-events: auto;
        }
        #partners span { color: #00aa44; font-family: 'Courier New', Courier, monospace; font-size: 10px; border: 1px solid #005522; padding: 2px 6px; }

        @media (max-width: 600px) {
            #chat-ui { width: calc(100% - 30px); left: 15px; right: 15px; }
            #partners { display: none; }
        }
        @media (min-width: 800px) { #dpad { opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- 1. START OVERLAY -->
    <div id="start-overlay">
        <button id="start-btn">INITIALIZE ARCHIVE</button>
        <span class="start-subtitle">[ SURABAYA OLD CITY URBAN EXPLORATION LOG ]</span>
    </div>
    
    <!-- 2. LANGUAGE TOGGLE / CHAT TRIGGER -->
    <a href="#" class="lang-link" id="lang-toggle">[ID]</a>
    <button id="chat-toggle-btn">[ LIVECHAT ]</button>

    <!-- 3. LIVE CHAT PANEL -->
    <div id="chat-ui">
        <div class="chat-header">
            <span>[ TRANSMIT // EXPLORER_NODE ]</span>
            <span id="chat-status">[INIT]</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type transmission..." autocomplete="off">
            <button id="chat-send">TX</button>
        </div>
    </div>
    
    <!-- 4. NARRATIVE POPUP BUBBLE & GAME CANVAS -->
    <div id="text-bubble"></div>
    <canvas id="gameCanvas"></canvas>

    <!-- 5. ON-SCREEN D-PAD -->
    <div id="dpad">
        <div id="btn-up" class="dpad-btn">▲</div>
        <div id="btn-left" class="dpad-btn">◀</div>
        <div id="btn-right" class="dpad-btn">▶</div>
        <div id="btn-down" class="dpad-btn">▼</div>
    </div>

    <!-- 6. BRAND / PARTNER FOOTER -->
    <div id="partners">
        <span style="color:#00aa44;">[COLONIAL_ARCH]</span>
        <span style="color:#00aa44;">[KAMPUNG_ALLEY]</span>
        <span style="color:#00aa44;">[ORAL_HISTORY]</span>
    </div>

    <!-- ================================================================= -->
    <!-- GAME ENGINE LOGIC                                                 -->
    <!-- ================================================================= -->
    <script>
        const bgm = new Audio('https://github.com/defn-networks/muted-forest-wonokromo-karnivulgar/raw/main/ags_project-8-bit-219384.mp3'); 
        const stepSound = new Audio('https://github.com/defn-networks/muted-forest-wonokromo-karnivulgar/raw/main/footstep%20on%20concrete%204.mp3'); 
        bgm.loop = true;
        bgm.volume = 0.4;

        let hasStarted = false;
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-overlay').style.display = 'none';
            bgm.play().catch(e => console.log("Audio play blocked:", e));
            hasStarted = true;
        });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bubble = document.getElementById('text-bubble');
        const langToggle = document.getElementById('lang-toggle');

        let currentLang = 'EN';

        // Prevent bubble interaction clicks from triggering game movement
        ['mousedown', 'click', 'touchstart'].forEach(eventType => {
            bubble.addEventListener(eventType, (e) => {
                if (e.target.tagName === 'A') {
                    e.stopPropagation();
                    if(eventType === 'click') window.open(e.target.href, '_blank');
                }
            });
        });

        // Dynamic Resolution Sizing (16:9 Aspect Engine)
        let GAME_WIDTH = 320; let GAME_HEIGHT = 180; let WORLD_WIDTH = 1200; 

        function resizeCanvas() {
            const screenAspect = window.innerWidth / window.innerHeight;
            const baseAspect = 16 / 9;
            if (screenAspect > baseAspect) {
                GAME_HEIGHT = 180; GAME_WIDTH = Math.floor(GAME_HEIGHT * screenAspect);
            } else {
                GAME_WIDTH = 320; GAME_HEIGHT = 180;
            }
            canvas.width = GAME_WIDTH; canvas.height = GAME_HEIGHT;
            WORLD_WIDTH = Math.max(1200, GAME_WIDTH * 3);
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        // Bilingual Narrative Zones Data (Synchronized with user narrative)
        const textZonesData = {
            EN: [
                { 
                    x: 180, 
                    html: "<b>CHAPTER 01: THE OLD STREETS & ARCHITECTURE</b><br><br>My journey begins on the streets of the Old City of Surabaya. Rows of historic buildings stand close together with Dutch colonial characteristics—symmetrical facades, tall doors and windows, thick walls, and large ventilation openings designed for the tropical climate. Each weathered surface records layers of time. BAB 03: WARISAN MULTIETNIS & KETAHANAN MEMORI</b><br><br>Pengaruh budaya Tionghoa, Arab, Jawa, dan Eropa berpadu harmonis. Sebagai penjelajah kota yang memotret bangunan dan merekam memori warga, perjalanan ini menjadi eksplorasi memori, identitas, perubahan, dan kelangsungan hidup di Surabaya modern." 
                },
                { 
                    x: 500, 
                    html: "<b>CHAPTER 02: TRADITIONAL KAMPUNGS & INTIMATE DETAILS</b><br><br>Moving deeper into narrow alleys, heritage becomes intimate. I observe old repaired wooden doors, decorative window vents, faded shop lettering, and traditional ceramic tiles. Here, history lives within the daily routines of local residents. <b>BAB 01: JALANAN TUA & ARSITEKTUR KOLONIAL</b><br><br>Perjalanan saya bermula di jalanan Kota Tua Surabaya. Deretan bangunan bersejarah berdiri berdampingan dengan karakteristik kolonial Belanda—fasad simetris, pintu dan jendela tinggi, dinding tebal, serta ventilasi besar untuk iklim tropis. Setiap permukaan yang lapuk merekam lapisan waktu." 
                },
                { 
                    x: 850, 
                    html: "<b>CHAPTER 03: MULTI-ETHNIC HERITAGE & SURVIVAL</b><br><br>Chinese, Arab, Javanese, and European cultural influences blend seamlessly. As an urban explorer photographing buildings and recording resident memories, this journey becomes an exploration of memory, identity, change, and survival in modern Surabaya. BAB 02: KAMPUNG TRADISIONAL & DETAIL INTIM</b><br><br>Bergerak lebih dalam ke gang-gang sempit, warisan budaya menjadi intim. Saya mengamati pintu kayu tua yang sering diperbaiki, ventilasi dekoratif, tulisan toko yang pudar, dan lantai tegel tradisional. Di sini, sejarah hidup dalam rutinitas harian warga." 
                }
            ],
            ID: [
                { 
                    x: 180, 
                    html: 
                },
                { 
                    x: 500, 
                    html: 
                },
                { 
                    x: 850, 
                    html:  
                }
            ]
        };

        // Custom Color Palette for the Terminal & Explorer Aesthetic
        const colors = {
            sky: '#0a0a0a', skyDark: '#111111', path: '#181818', pathLine: '#005522',
            structure: '#161616', structureAccent: '#00ff66',
            skin: '#e8b59b', hair: '#ffffff', jacket: '#cc2222', shirt: '#ffffff', pants: '#ddbb33'
        };

        // Pixel Art Sprite Matrix for Young Male Urban Explorer:
        // White hair, compact explorer backpack, camera hanging around neck, red field jacket over plain white T-shirt, yellow cargo pants, comfortable sneakers.
        const characterSprite = [
            "  HHHH  ", 
            " HHHHHH ", 
            " BSSBB  ", // Face with camera strap hint (B)
            " JJJJJJ ", // Red field jacket collar / upper
            " JJJJJJ ", // Red field jacket body
            " JJJJJJ ", 
            " P P PP ", // Yellow cargo pants
            " P P PP ", 
            " SSSSSS "  // Comfortable sneakers
        ];
        const spriteColors = { 
            'H': colors.hair, 
            'S': colors.skin, 
            'B': '#444444', // Camera / strap detail
            'J': colors.jacket, 
            'P': colors.pants 
        };

        function drawSprite(spriteData, startX, startY, colorMap) {
            for (let row = 0; row < spriteData.length; row++) {
                for (let col = 0; col < spriteData[row].length; col++) {
                    const char = spriteData[row][col];
                    if (char !== ' ') {
                        ctx.fillStyle = colorMap[char] || '#00ff66';
                        ctx.fillRect(Math.floor(startX + col), Math.floor(startY + row), 1, 1);
                    }
                }
            }
        }

        // State Machine Variables
        const player = { x: 50, y: 150, speed: 1.5, dx: 0, dy: 0 };
        let activeZone = null; let stepCounter = 0; let cameraX = 0;
        const keys = { w: false, a: false, s: false, d: false };

        // Keyboard Event Binds
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // Touch Control Binds
        function setupTouchButton(buttonId, keyName) {
            const btn = document.getElementById(buttonId);
            const press = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };
            
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }
        setupTouchButton('btn-up', 'w'); setupTouchButton('btn-left', 'a');
        setupTouchButton('btn-down', 's'); setupTouchButton('btn-right', 'd');

        // Language toggle event listener
        langToggle.addEventListener('click', (e) => {
            e.preventDefault();
            currentLang = currentLang === 'EN' ? 'ID' : 'EN';
            langToggle.textContent = currentLang === 'EN' ? '[ID]' : '[EN]';
            activeZone = null;
            bubble.style.display = 'none';
        });

        // --- ENVIRONMENT RENDERING LAYERS ---
        function drawBackground() {
            ctx.fillStyle = colors.sky; ctx.fillRect(0, 0, WORLD_WIDTH, GAME_HEIGHT);
            
            ctx.strokeStyle = '#003311';
            ctx.lineWidth = 1;
            
            // Building 1 (Colonial Warehouse)
            ctx.fillStyle = colors.structure; 
            ctx.fillRect(100, 30, 220, 100);
            ctx.strokeRect(100, 30, 220, 100);
            ctx.fillStyle = '#001a0a';
            ctx.fillRect(120, 50, 30, 60);
            ctx.fillRect(170, 50, 30, 60);
            ctx.fillRect(220, 50, 30, 60);
            ctx.fillRect(270, 50, 30, 60);

            // Building 2 (Traditional Kampung Houses / Shophouse)
            ctx.fillStyle = colors.structure;
            ctx.fillRect(440, 40, 250, 90);
            ctx.strokeRect(440, 40, 250, 90);
            ctx.fillStyle = '#001a0a';
            ctx.fillRect(470, 60, 40, 50);
            ctx.fillRect(540, 60, 40, 50);
            ctx.fillRect(610, 60, 50, 50);

            // Building 3 (Historic Commercial District)
            ctx.fillStyle = colors.structure;
            ctx.fillRect(780, 20, 320, 110);
            ctx.strokeRect(780, 20, 320, 110);
            ctx.fillStyle = '#001a0a';
            ctx.fillRect(810, 40, 40, 70);
            ctx.fillRect(870, 40, 40, 70);
            ctx.fillRect(950, 40, 60, 70);
            ctx.fillRect(1030, 40, 40, 70);
        }

        function drawWalkway() {
            ctx.fillStyle = colors.path; ctx.fillRect(0, 130, WORLD_WIDTH, 50);
            ctx.strokeStyle = colors.pathLine;
            ctx.beginPath();
            ctx.moveTo(0, 130);
            ctx.lineTo(WORLD_WIDTH, 130);
            ctx.stroke();
        }

        // --- MAIN GAME LOOP ---
        function update() {
            if (hasStarted) {
                player.dy = keys.w ? -player.speed : (keys.s ? player.speed : 0);
                player.dx = keys.a ? -player.speed : (keys.d ? player.speed : 0);

                if (player.dx !== 0 || player.dy !== 0) {
                    stepCounter++;
                    if (stepCounter > 20) { stepSound.play().catch(()=>{}); stepCounter = 0; }
                }
                
                player.x += player.dx; player.y += player.dy;
                
                if (player.x < 0) player.x = 0;
                if (player.x > WORLD_WIDTH - 8) player.x = WORLD_WIDTH - 8;
                if (player.y < 120) player.y = 120; 
                if (player.y > GAME_HEIGHT - 10) player.y = GAME_HEIGHT - 10;
            }

            cameraX = player.x - GAME_WIDTH / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - GAME_WIDTH) cameraX = WORLD_WIDTH - GAME_WIDTH;

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.save();
            ctx.translate(-cameraX, 0); 
            
            drawBackground(); 
            drawWalkway();
            drawSprite(characterSprite, player.x, player.y, spriteColors);

            // Proximity Trigger Calculation
            const currentZones = textZonesData[currentLang];
            let foundZone = currentZones.find(z => Math.abs(player.x - z.x) < 50);
            if (foundZone) {
                if (activeZone !== foundZone) {
                    bubble.style.display = 'block';
                    bubble.innerHTML = foundZone.html;
                    activeZone = foundZone;
                }
            } else if (activeZone !== null) {
                bubble.style.display = 'none';
                activeZone = null;
            }
            
            ctx.restore(); 
            requestAnimationFrame(update);
        }
        
        update();
    </script>

    <!-- ================================================================= -->
    <!-- FIREBASE REALTIME CHAT ENGINE                                     -->
    <!-- ================================================================= -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "0000000000",
            appId: "1:0000000000:web:000000000000"
        };

        const chatUi = document.getElementById("chat-ui");
        const toggleBtn = document.getElementById("chat-toggle-btn");
        const chatMessagesDiv = document.getElementById("chat-messages");
        const chatInput = document.getElementById("chat-input");
        const chatSend = document.getElementById("chat-send");
        const chatStatus = document.getElementById("chat-status");

        toggleBtn.addEventListener('click', () => {
            if (chatUi.style.display === 'flex') {
                chatUi.style.display = 'none';
                toggleBtn.innerText = '[ LIVECHAT ]';
            } else {
                chatUi.style.display = 'flex';
                toggleBtn.innerText = '[ CLOSE_CHT ]';
                chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
            }
        });

        ['mousedown', 'touchstart'].forEach(type => {
            chatUi.addEventListener(type, e => e.stopPropagation());
            toggleBtn.addEventListener(type, e => e.stopPropagation());
        });

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            let currentUser = null;

            signInAnonymously(auth).catch(() => chatStatus.innerText = "[OFFLINE]");

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    chatStatus.innerText = "[ONLINE]";
                    
                    const q = query(collection(db, "surabaya_old_city_chat"), orderBy("timestamp", "asc"));
                    onSnapshot(q, (snapshot) => {
                        chatMessagesDiv.innerHTML = "";
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            const messageEl = document.createElement("div");
                            messageEl.classList.add("message");
                            const userName = "explorer_" + data.uid.slice(-4);
                            messageEl.innerHTML = `
                                <div class="message-user">${escapeHtml(userName)}</div>
                                <div class="message-text">${escapeHtml(data.text)}</div>
                            `;
                            chatMessagesDiv.appendChild(messageEl);
                        });
                        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
                    });
                }
            });

            const sendMessage = async () => {
                const text = chatInput.value.trim();
                if (!text || !currentUser) return;
                try {
                    await addDoc(collection(db, "surabaya_old_city_chat"), {
                        text: text,
                        uid: currentUser.uid,
                        timestamp: serverTimestamp()
                    });
                    chatInput.value = "";
                } catch (err) { console.error(err); }
            };

            chatSend.addEventListener("click", sendMessage);
            chatInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

        } catch(e) {
            chatStatus.innerText = "[OFFLINE]";
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }
    </script>
</body>
</html>
